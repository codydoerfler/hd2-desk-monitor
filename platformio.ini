; ============================================================================
;  Helldivers 2 — Major Order Desk Monitor
;  Target: Hosyond 4.0" 320x480 ESP32-32E display board
;          (LCDwiki part number E32R40T — ESP32-D0WD-V3 + ST7796S + XPT2046)
; ============================================================================

[env:hosyond-esp32-32e]
platform  = espressif32@6.9.0
board     = esp32dev              ; ESP32-D0WD-V3, 4MB flash, no PSRAM
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
upload_speed   = 115200

; OTA needs two app slots to flash into: the running image stays put while the
; download lands in the inactive slot, and only a complete, verified image
; flips the boot pointer. min_spiffs gives us that as app0/app1 at 0x1E0000
; (1.875 MiB) each, plus a 128 KB spiffs partition we never mount — all art is
; compiled-in PROGMEM (hud_biomes.h and friends), so no filesystem is needed
; and its space is not worth reclaiming.
;
; (The stock default table caps the app at ~1.3MB, which HTTPS + WiFiManager
;  + TFT_eSPI overflows, which is why huge_app.csv was used before OTA.)
;
; >>> HEADROOM IS TIGHT <<< The image is ~1.86MB against a 1.875MB slot —
; roughly 100KB spare, ~5%. Adding more compiled-in art (extra biome
; backdrops, faction badges, fonts) will hit this ceiling quickly, and the
; failure mode is a link error, not a subtle one. When it does: write a custom
; partition CSV that shrinks nvs/spiffs/coredump and grows both app slots, and
; keep them the same size as each other — OTA requires the inactive slot to
; hold a whole image.
board_build.partitions = min_spiffs.csv

; Defines HD2_FW_VERSION from `git describe --tags`. The OTA checker compares
; that string against the latest GitHub release tag, so it is derived rather
; than hand-maintained — see the header comment in the script for why.
extra_scripts = pre:tools/fw_version.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    ; ---------------------------------------------------------------------
    ;  TFT_eSPI configuration.
    ;
    ;  Defined here rather than by editing User_Setup.h inside the library so
    ;  that a `pio run` on a clean checkout Just Works and library updates
    ;  don't stomp the config.
    ;
    ;  >>> PIN MAPPING — VERIFY AGAINST THE PHYSICAL BOARD SILKSCREEN <<<
    ;  Source: LCDwiki "4.0inch ESP32-32E Display" (board E32R40T), the
    ;  manufacturer reference for the module Hosyond resells:
    ;      https://www.lcdwiki.com/4.0inch_ESP32-32E_Display
    ;  Cross-checked against the ESP32 "Cheap Yellow Display" community
    ;  pinout (github.com/witnessmenow/ESP32-Cheap-Yellow-Display), which
    ;  uses the same HSPI group (12/13/14) + CS 15 + DC 2 + BL 27 + touch 33.
    ;  See README.md "Pin mapping" for what to change if the panel is blank.
    ; ---------------------------------------------------------------------
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320                ; panel native portrait W (rotated in code)
    -D TFT_HEIGHT=480               ; panel native portrait H

    -D TFT_MISO=12                  ; NOTE: GPIO12 is the MTDI strapping pin.
                                    ; It is wired this way by the board vendor;
                                    ; harmless here, but don't repurpose it.
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2                     ; a.k.a. RS. High = data, low = command
    -D TFT_RST=-1                   ; panel RST is tied to the ESP32 EN line;
                                    ; there is no dedicated GPIO for it
    -D TFT_BL=27                    ; backlight enable, active high
    -D TFT_BACKLIGHT_ON=HIGH

    ; XPT2046 resistive touch shares the SPI bus above, its own chip select.
    ; Unused in v1 (read-only display) but declared so the pin isn't driven
    ; by anything else and so touch is one #include away later.
    -D TOUCH_CS=33

    ; GPIO 12/13/14/15 are the ESP32's native HSPI pins, so use that
    ; peripheral directly instead of routing through the GPIO matrix.
    ; If the panel stays blank, try commenting this line out first.
    -D USE_HSPI_PORT=1

    ; Fonts: GFXFF (Adafruit free fonts) is all the HUD uses. The individual
    ; font tables are pulled in by src/hud_fonts.h.
    -D LOAD_GLCD=1
    -D LOAD_GFXFF=1

    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

    ; ---------------------------------------------------------------------
    ;  Application configuration. Everything here is also documented in
    ;  README.md — these are the knobs you're most likely to turn.
    ; ---------------------------------------------------------------------
    ; TODO: replace with a real contact (email or repo URL) before running
    ; this against the public API for any length of time. The Helldivers 2
    ; Community API asks that X-Super-Contact identify a reachable human.
    -D HD2_CONTACT_HEADER='"https://github.com/your-user/hd2-desk-monitor"'
    -D HD2_CLIENT_HEADER='"hd2-desk-monitor"'
    -D HD2_POLL_INTERVAL_S=300      ; 5 min. API limit is 5 req / 10 s and we
                                    ; spend 3 per poll — do not go below ~60.

    ; Where OTA looks for firmware. A fork must change this, or its devices
    ; will update themselves back onto this project's builds. The check
    ; interval lives next to the code that uses it, in src/hd2_ota.h.
    -D HD2_OTA_REPO='"codydoerfler/hd2-desk-monitor"'

    -D CORE_DEBUG_LEVEL=1
